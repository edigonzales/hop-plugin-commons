name: Build and publish snapshot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: edigonzales/hop-plugin-ci/.github/workflows/verify.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-24.04", "windows-2025", "macos-15"]'
      canonical-runner-os: ubuntu-24.04
      canonical-java-version: '21'
      maven-working-directory: .
      pom-file: pom.xml
      maven-options: -U -B -ntp
      maven-goals: clean package
      compatibility-goals: clean test
      artifact-name-prefix: hop-plugin-commons
      artifacts: >-
        [{"pom":"pom.xml"},
         {"pom":"hop-plugin-commons-core/pom.xml","file":"hop-plugin-commons-core/target/hop-plugin-commons-core-*-SNAPSHOT.jar","classifiers":["sources","javadoc"]},
         {"pom":"hop-plugin-commons-ui/pom.xml","file":"hop-plugin-commons-ui/target/hop-plugin-commons-ui-*-SNAPSHOT.jar","classifiers":["sources","javadoc"]}]

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: edigonzales/hop-plugin-ci/.github/workflows/publish.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      repository-kind: snapshot
      verified-artifact-name: ${{ needs.verify.outputs.canonical-artifact-name }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}

  verify-published:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 scripts/verify-snapshot.py
